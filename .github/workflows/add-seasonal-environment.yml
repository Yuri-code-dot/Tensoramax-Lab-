name: Add seasonal environment

on:
  push:
    paths-ignore:
      - '.github/workflows/add-seasonal-environment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject seasonal environment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* TENSORA_SEASONAL_ENVIRONMENT */'
          if marker in s:
              print('Seasonal environment already installed.')
              raise SystemExit(0)

          css = r'''<style id="tensoramax-seasonal-css">
          /* TENSORA_SEASONAL_ENVIRONMENT */
          #seasonal-environment{position:fixed;top:88px;right:28px;z-index:45;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid rgba(255,255,255,.12);background:rgba(5,5,5,.62);backdrop-filter:blur(14px);font:9px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#777;transition:border-color .25s,opacity .25s}
          #seasonal-environment:hover{border-color:rgba(255,255,255,.28)}
          #seasonal-environment .season-value{color:#eee}
          #seasonal-environment button{padding:3px 0;color:#777;letter-spacing:.1em}
          #seasonal-environment button:hover{color:#fff}
          #seasonal-environment .effect-state{color:var(--purple);min-width:19px;text-align:center}
          #seasonal-snow{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
          .season-snowflake{position:absolute;top:-30px;color:rgba(255,255,255,.72);font-family:Arial,sans-serif;line-height:1;will-change:transform;filter:drop-shadow(0 0 7px rgba(255,255,255,.12))}
          @media(max-width:800px){#seasonal-environment{top:74px;right:14px;padding:8px 9px;font-size:8px}.season-snowflake{color:rgba(255,255,255,.62)}}
          @media(prefers-reduced-motion:reduce){#seasonal-snow{display:none}}
          </style>'''

          html = r'''<div id="seasonal-environment" aria-label="Current Lab season and seasonal effects">
            <span>SEASON</span><span class="season-value">WINTER</span><span aria-hidden="true">/</span>
            <span>EFFECT</span><button id="season-effect-toggle" type="button" aria-pressed="true"><span class="effect-state">ON</span></button>
          </div>
          <div id="seasonal-snow" aria-hidden="true"></div>'''

          js = r'''<script id="tensoramax-seasonal-js">
          (()=>{
            const root=document.getElementById('seasonal-snow');
            const toggle=document.getElementById('season-effect-toggle');
            const state=toggle?.querySelector('.effect-state');
            if(!root||!toggle||!state)return;
            const key='tensoramax-seasonal-effects';
            const saved=localStorage.getItem(key);
            let enabled=saved!=='off';
            const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if(reduced)enabled=false;
            const flakes=[];
            const glyphs=['❄','✦','✧','·'];
            const count=window.innerWidth<700?34:64;
            for(let i=0;i<count;i++){
              const el=document.createElement('span');
              el.className='season-snowflake';
              el.textContent=glyphs[i%glyphs.length];
              el.style.left=(Math.random()*100)+'vw';
              el.style.fontSize=(6+Math.random()*14)+'px';
              el.style.opacity=(.18+Math.random()*.62).toFixed(2);
              root.appendChild(el);
              flakes.push({el,x:parseFloat(el.style.left),y:-30-Math.random()*110,vy:.25+Math.random()*.75,vx:(Math.random()-.5)*.22,phase:Math.random()*Math.PI*2,wobble:.15+Math.random()*.35});
            }
            function render(){
              state.textContent=enabled?'ON':'OFF';
              toggle.setAttribute('aria-pressed',String(enabled));
              root.style.display=enabled?'block':'none';
            }
            toggle.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem(key,enabled?'on':'off');render()});
            let last=performance.now();
            function frame(now){
              const dt=Math.min(32,now-last); last=now;
              if(enabled){
                for(const f of flakes){
                  f.y+=f.vy*dt; f.x+=f.vx*dt; f.phase+=.0015*dt;
                  const drift=Math.sin(f.phase)*f.wobble;
                  if(f.y>innerHeight+30){f.y=-30-Math.random()*90;f.x=Math.random()*innerWidth}
                  if(f.x<-30)f.x=innerWidth+20;if(f.x>innerWidth+30)f.x=-20;
                  f.el.style.transform=`translate3d(${f.x}px,${f.y}px,0) rotate(${f.phase*35}deg)`;
                }
              }
              requestAnimationFrame(frame);
            }
            render(); requestAnimationFrame(frame);
          })();
          </script>'''

          s=s.replace('</head>', css+'\n</head>', 1)
          s=s.replace('<main id="top">', html+'\n<main id="top">', 1)
          s=s.replace('</body>', js+'\n</body>', 1)
          p.write_text(s)
          PY

      - name: Commit seasonal environment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add winter seasonal environment"
          git push
