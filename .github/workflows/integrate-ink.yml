name: Integrate liquid ink transition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Lab
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='TENSORAMAX_LIQUID_INK_V1'
          if marker in s:
              raise SystemExit(0)

          css='''<style id="tensoramax-liquid-ink-css">
          /* TENSORAMAX_LIQUID_INK_V1 */
          #lab-ink{position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden;background:#07000a;transition:opacity .2s ease,visibility .2s ease}
          #lab-ink.is-active{opacity:1;visibility:visible;pointer-events:auto;touch-action:none}
          #lab-ink-canvas{position:absolute;inset:0;width:100%;height:100%}
          #lab-ink-hint{position:absolute;left:50%;bottom:8vh;transform:translateX(-50%);font:9px 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);opacity:0;transition:opacity .3s;white-space:nowrap}
          #lab-ink.is-active #lab-ink-hint{opacity:1}
          #lab-ink-rip{position:absolute;width:90px;height:90px;border:1px solid rgba(255,255,255,.22);border-radius:50%;transform:translate(-50%,-50%) scale(.25);opacity:0;mix-blend-mode:screen;pointer-events:none}
          @media(max-width:800px){#lab-ink-hint{bottom:5vh;font-size:8px}}
          @media(prefers-reduced-motion:reduce){#lab-ink{display:none!important}}
          </style>'''

          html='''<div id="lab-ink" aria-hidden="true"><canvas id="lab-ink-canvas"></canvas><div id="lab-ink-rip"></div><div id="lab-ink-hint">DRAG DOWN · LIQUID STATE</div></div>'''

          js='''<script id="tensoramax-liquid-ink-js">
          (()=>{
            const layer=document.getElementById('lab-ink'),canvas=document.getElementById('lab-ink-canvas'),rip=document.getElementById('lab-ink-rip');
            if(!layer||!canvas)return;
            const ctx=canvas.getContext('2d',{alpha:false}); if(!ctx)return;
            let w=0,h=0,dpr=1,active=false,drag=false,startY=0,progress=0,target=0,velocity=0,lastY=0;
            const blobs=Array.from({length:22},(_,i)=>({x:(i/21)*1.12-.06,y:.5+(Math.random()-.5)*.16,r:.025+Math.random()*.045,phase:Math.random()*6.28,speed:.35+Math.random()*.75}));
            function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
            addEventListener('resize',resize,{passive:true});resize();
            function open(){active=true;drag=true;startY=lastY=innerHeight*.12;progress=0;target=0;velocity=0;layer.classList.add('is-active');layer.setAttribute('aria-hidden','false')}
            function close(){drag=false;active=false;layer.classList.remove('is-active');layer.setAttribute('aria-hidden','true')}
            function paint(t){
              ctx.clearRect(0,0,w,h);
              ctx.fillStyle='#080008';ctx.fillRect(0,0,w,h);
              const edge=Math.max(-.05,Math.min(1.08,target));
              ctx.save();
              ctx.beginPath();
              const points=72;
              ctx.moveTo(0,0);ctx.lineTo(w,0);
              for(let i=0;i<=points;i++){
                const x=w*i/points;
                const nx=i/points;
                const wave=Math.sin(nx*17+t*.0012)*(.012+Math.abs(velocity)*.002)+Math.sin(nx*41-t*.0008)*.006;
                const blob=blobs.reduce((a,b)=>a+Math.exp(-Math.pow((nx-b.x)/(b.r*3),2))*b.r*(.35+.65*Math.sin(t*.001*b.speed+b.phase)),0);
                const y=(edge+wave+blob)*h;
                ctx.lineTo(x,y);
              }
              ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();
              const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#d31b55');g.addColorStop(.55,'#b30f3d');g.addColorStop(1,'#6f092d');ctx.fillStyle=g;ctx.shadowColor='rgba(211,27,85,.28)';ctx.shadowBlur=45;ctx.fill();ctx.restore();
              if(edge>.08){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.16;ctx.strokeStyle='#ff6b9b';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=points;i++){const x=w*i/points;const nx=i/points;const wave=Math.sin(nx*17+t*.0012)*(.012+Math.abs(velocity)*.002)+Math.sin(nx*41-t*.0008)*.006;ctx.lineTo(x,(edge+wave)*h)}ctx.stroke();ctx.restore()}
            }
            function tick(t){if(active){target+=(progress-target)*.16;paint(t)}requestAnimationFrame(tick)}
            function move(y){if(!drag)return;velocity=y-lastY;lastY=y;progress=Math.max(0,Math.min(1.08,(y-startY)/h));target=progress;if(rip){rip.style.left='50%';rip.style.top=Math.max(0,Math.min(100,progress*100))+'%';rip.style.opacity=Math.min(.5,progress+.08);rip.style.transform=`translate(-50%,-50%) scale(${.35+progress*1.4})`}}
            addEventListener('pointerdown',e=>{if(e.target.closest('a,button,input,textarea,select'))return;if(e.clientY<innerHeight*.22)open()},{passive:true});
            addEventListener('pointermove',e=>{if(active)move(e.clientY)},{passive:true});
            addEventListener('pointerup',()=>{if(!active)return;if(progress>.78){target=1.08;progress=1.08;setTimeout(close,650)}else{target=0;setTimeout(close,320)}},{passive:true});
            addEventListener('pointercancel',()=>active&&close(),{passive:true});
            requestAnimationFrame(tick);
          })();
          </script>'''

          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('<main id="top">',html+'\n<main id="top">',1)
          s=s.replace('</body>',js+'\n</body>',1)

          # Keep the seasonal control pinned above the liquid layer while the user drags.
          seasonal='''#seasonal-environment{position:fixed;top:88px;right:28px;z-index:190;'''
          s=s.replace('#seasonal-environment{position:fixed;top:88px;right:28px;z-index:45;',seasonal,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate liquid ink transformation" || exit 0
          git push
